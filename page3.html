<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Chaos!</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
<style>
    
    body{
        background-color: #011d22;
        color:aqua
    }
    #header{
        width:300px;
        text-align: center;
        margin: auto;
    }
    .panel{
        height: 400px;
        width: 600px;
        float: left;
    }
    .panel img {
        width: 100%;
        height: 100%;
    }
    
    #body{
        width: 100%;
        min-height: 100%;
        padding-bottom: 60px;
        margin-left: 10px;
        margin-right: 10px;
        
    }
    #comic{max-width: 600px;
    margin:auto;}

    </style>
</head>
<body>
    <div id="container">
    <div id="header">
        <h1>Robot Chaos!</h1>
        <audio id="music" src="music.wav" loop="loop"></audio>
    </div>
    <div id="body">
        <div id="comic">
            <div class="panel" id="1" data-aos="fade-right"> <img src="images/panel 21.jpg"></div>
            <div class="panel" id="1" data-aos="fade-left"> <img src="images/panel 22.jpg"></div>
            <div class="panel" id="1" data-aos="fade-right"> <img src="images/panel 23.jpg"></div>
            <div class="panel" id="1" data-aos="fade-left"> <img src="images/panel 24.jpg"></div>
            <div class="panel" id="1" data-aos="fade-right"> <img src="images/panel 25.jpg"></div>
            <div class="panel" id="1" data-aos="fade-up"> <img src="images/panel 26.jpg"></div>
                </div>
            </div>
        </div>
    
<script src="https://cdn.rawgit.com/michalsnik/aos/2.1.1/dist/aos.js"></script>
<script>
    AOS.init();
    
</script>
<script>window.onload = function() {
    document.getElementById("music").play();
}</script>
</body>
</html>
